name = "memeos"
main = "worker/index.ts"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_ENV = "production"
SUPABASE_URL = "https://brlqdwnpoamvfuhdpdtx.supabase.co"
META_GRAPH_VERSION = "v27.0"
META_APP_ID = "1853871738958660"
META_REDIRECT_URI = "https://memeos.mithbuilds.workers.dev/api/meta/callback"
GITHUB_REPO = "mithbuilds-star/MemeOS"

[triggers]
crons = ["* * * * *"]

# Workers AI provides server-side image text extraction.
[ai]
binding = "AI"

