name = "memeos"
main = "worker/index.ts"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_ENV = "production"
SUPABASE_URL = "https://brlqdwnpoamvfuhdpdtx.supabase.co"
META_GRAPH_VERSION = "v27.0"
# Set RENDER_SERVICE_URL as a Worker runtime variable after deploying render-service.

[triggers]
crons = ["*/5 * * * *"]

# Workers AI provides server-side image text extraction.
[ai]
binding = "AI"

