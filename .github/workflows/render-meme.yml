name: render-meme

on:
  workflow_dispatch:
    inputs:
      meme_id:
        description: Meme row id
        required: true
        type: string
      owner_id:
        description: Owner user id
        required: true
        type: string
      text:
        description: Meme text
        required: true
        type: string
      freeze_seconds:
        description: Final-frame hold (0-5)
        required: false
        default: "2"
        type: string
      song_id:
        description: Song id (optional)
        required: false
        default: ""
        type: string
      attempt_token:
        description: Worker attempt token; writes are rejected once ownership moves on
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One render at a time.
# No concurrency group: each render is independent. A shared group keeps only one pending run and cancels the rest.

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install renderer
        working-directory: render
        run: npm install --no-audit --no-fund
      - name: Render and publish
        working-directory: render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MEME_ID: ${{ inputs.meme_id }}
          OWNER_ID: ${{ inputs.owner_id }}
          TEXT: ${{ inputs.text }}
          FREEZE_SECONDS: ${{ inputs.freeze_seconds }}
          SONG_ID: ${{ inputs.song_id }}
          ATTEMPT_TOKEN: ${{ inputs.attempt_token }}
        run: node render.mjs
